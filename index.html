<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus SMS Panel</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --ios-bg: rgba(255, 255, 255, 0.1);
            --dark-bg: #0a0a0c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Neon Background Elements */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        /* Main Container - iOS Glassmorphism */
        .container {
            width: 90%;
            max-width: 500px;
            background: var(--ios-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 30px;
            background: linear-gradient(to right, #00d2ff, #9d50bb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 10px;
            display: block;
            margin-left: 10px;
        }

        /* API Selection */
        .api-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .api-option {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .api-option.active {
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            border: none;
        }

        /* Input Field */
        .input-group {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(157, 80, 187, 0.4);
        }

        /* Button */
        .send-btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .send-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.4);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        /* Console / Terminal UI */
        .terminal {
            margin-top: 30px;
            background: #000;
            border-radius: 15px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,1);
        }

        .terminal::-webkit-scrollbar {
            width: 5px;
        }

        .terminal::-webkit-scrollbar-thumb {
            background: var(--neon-blue);
            border-radius: 10px;
        }

        .line { margin-bottom: 5px; }
        .info { color: #00d2ff; }
        .success { color: #00ff88; }
        .error { color: #ff4b2b; }
        .timestamp { color: #555; margin-right: 8px; }

        .typing::after {
            content: "|";
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="blob"></div>

<div class="container">
    <h1>NEXUS SENDER</h1>

    <span class="section-label">Xidmət Seçin</span>
    <div class="api-selector">
        <div class="api-option active" onclick="selectApi('Tats', this)">Tats.az</div>
        <div class="api-option" onclick="selectApi('Auto', this)">Auto.az</div>
    </div>

    <div class="input-group">
        <span class="section-label">Mobil Nömrə</span>
        <input type="tel" id="phone" placeholder="50 123 45 67" maxlength="10">
    </div>

    <button class="send-btn" onclick="startProcess()">GÖNDƏRİLMƏYƏ BAŞLA</button>

    <div class="terminal" id="console">
        <div class="line info">> Sistem gözləyir...</div>
    </div>
</div>

<script>
    let selectedApi = 'Tats';

    function selectApi(api, el) {
        selectedApi = api;
        document.querySelectorAll('.api-option').forEach(opt => opt.classList.remove('active'));
        el.classList.add('active');
        log(`Xidmət dəyişdirildi: ${api}`, 'info');
    }

    function log(message, type = '') {
        const consoleEl = document.getElementById('console');
        const now = new Date();
        const time = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
        
        const line = document.createElement('div');
        line.className = `line ${type}`;
        line.innerHTML = `<span class="timestamp">[${time}]</span> ${message}`;
        
        consoleEl.appendChild(line);
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function startProcess() {
        const phone = document.getElementById('phone').value;
        
        if (phone.length < 9) {
            log("Xəta: Nömrə düzgün deyil!", "error");
            return;
        }

        log(`Proses başladılır: ${selectedApi} API`, "info");
        log(`Hədəf: ${phone}`, "info");

        // Simulyasiya üçün loop (Həqiqi API sorğusu üçün Fetch istifadə edilməlidir)
        for(let i = 1; i <= 5; i++) {
            await new Promise(r => setTimeout(r, 1200));
            
            const isSuccess = Math.random() > 0.3; // 70% uğurlu ehtimalı
            
            if(isSuccess) {
                log(`Sınaq ${i}: Paket uğurla göndərildi.`, "success");
            } else {
                log(`Sınaq ${i}: Xəta baş verdi (Timeout).`, "error");
            }
        }
        
        log("Proses yekunlaşdı.", "info");
    }

    // İlk açılış mesajı
    window.onload = () => {
        log("Nexus OS yükləndi...", "success");
        log("Bütün sistemlər aktivdir.", "info");
    };
</script>

</body>
</html>
